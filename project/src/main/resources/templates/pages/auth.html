<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — PageTurn</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
d
    :root {
      --ink: #1A1A1A;
      --accent: #C8A96E;
      --accent-dark: #A8854A;
      --bg: #FAF8F5;
      --bg-panel: #FFFFFF;
      --border: #E8E4DC;
      --text-muted: #9B9080;
      --red: #D64545;
      --success: #2D7D46;
      --shadow: 0 8px 40px rgba(0, 0, 0, 0.10);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Background decoration */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(200, 169, 110, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 10% 80%, rgba(200, 169, 110, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .logo-icon {
      font-size: 28px;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    /* Card */
    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      padding: 36px 36px 32px;
      position: relative;
      z-index: 1;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--bg-panel);
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
    }

    /* Form title */
    .form-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .form-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    /* Form */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200, 169, 110, 0.15);
      background: #fff;
    }

    .form-group input.error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(214, 69, 69, 0.10);
    }

    .field-err {
      display: block;
      font-size: 12px;
      color: var(--red);
      margin-top: 5px;
      min-height: 16px;
    }

    /* Row */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      font-size: 13px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--accent);
    }

    .link-small {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
    }

    .link-small:hover {
      text-decoration: underline;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      color: #fff;
      background: var(--ink);
      border: none;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.2px;
    }

    .btn-primary:hover {
      background: #2d2d2d;
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Google */
    .btn-google {
      width: 100%;
      padding: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .btn-google:hover {
      border-color: #ccc;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
    }

    /* Hidden */
    .hidden {
      display: none !important;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: var(--ink);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 11px 20px;
      border-radius: 50px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast.success {
      background: var(--success);
    }

    #toast.info {
      background: #3A6EA5;
    }

    /* Back link */
    .back-link {
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .back-link a {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 500;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <a href="../index.html" class="logo">
    <span class="logo-icon">📖</span>
    <span class="logo-text">PageTurn</span>
  </a>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="tab" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <h2 class="form-title">Chào mừng trở lại!</h2>
      <p class="form-sub">Đăng nhập vào tài khoản của bạn</p>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" oninput="clearErr('login-email')">
        <span class="field-err" id="login-email-err"></span>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="login-pass" placeholder="••••••••" oninput="clearErr('login-pass')">
        <span class="field-err" id="login-pass-err"></span>
      </div>

      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="remember"> Ghi nhớ đăng nhập
        </label>
        <a href="#" class="link-small" onclick="showToast('Chức năng demo', 'info'); return false;">Quên mật khẩu?</a>
      </div>

      <div class="divider">hoặc</div>

      <button class="btn-google" onclick="showToast('Google login sắp ra mắt!', 'info')">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
          <path fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
          <path fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
          <path fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
        </svg>
        Tiếp tục với Google
      </button>
    </div>

    <!-- REGISTER -->
    <div id="register-form" class="hidden">
      <h2 class="form-title">Tạo tài khoản</h2>
      <p class="form-sub">Tham gia PageTurn ngay hôm nay</p>

      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="reg-name" placeholder="Nguyễn Văn A" oninput="clearErr('reg-name')">
        <span class="field-err" id="reg-name-err"></span>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" oninput="clearErr('reg-email')">
        <span class="field-err" id="reg-email-err"></span>
      </div>
      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" id="reg-phone" placeholder="0912345678" oninput="clearErr('reg-phone')">
        <span class="field-err" id="reg-phone-err"></span>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="reg-pass" placeholder="Tối thiểu 8 ký tự" oninput="clearErr('reg-pass')">
        <span class="field-err" id="reg-pass-err"></span>
      </div>

      <button class="btn-primary" onclick="handleRegister()">Tạo tài khoản</button>
    </div>
  </div>

  <p class="back-link"><a href="../index.html">← Quay về trang chủ</a></p>

  <div id="toast"></div>

  <script>
    // ── Mock users ──
    const MOCK_USERS = [
      { id: 1, name: "Admin User", email: "admin@pageturn.vn", password: "admin123", role: "admin" },
      { id: 2, name: "Test User", email: "user@pageturn.vn", password: "user1234", role: "user" },
    ];
    let users = JSON.parse(localStorage.getItem("pt_users") || JSON.stringify(MOCK_USERS));

    // ── Tab switch ──
    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach((t, i) =>
        t.classList.toggle("active", (i === 0 && tab === "login") || (i === 1 && tab === "register"))
      );
      document.getElementById("login-form").classList.toggle("hidden", tab !== "login");
      document.getElementById("register-form").classList.toggle("hidden", tab !== "register");
    }

    // ── Field errors ──
    function clearErr(id) {
      document.getElementById(id)?.classList.remove("error");
      const e = document.getElementById(id + "-err");
      if (e) e.textContent = "";
    }
    function showErr(id, msg) {
      document.getElementById(id)?.classList.add("error");
      const e = document.getElementById(id + "-err");
      if (e) e.textContent = msg;
      return false;
    }

    // ── Validators ──
    const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    const isPhone = v => /^\d{9,11}$/.test(v);

    // ── Login ──
    function handleLogin() {
        const email = document.getElementById("login-email").value.trim();
        const pass = document.getElementById("login-pass").value;
        let ok = true;

        if (!email) { showErr("login-email", "Vui lòng nhập email"); ok = false; }
        else if (!isEmail(email)) { showErr("login-email", "Email không hợp lệ"); ok = false; }
        if (!pass) { showErr("login-pass", "Vui lòng nhập mật khẩu"); ok = false; }
        if (!ok) return;

        // Submit thẳng tới Spring Security — bỏ mock auth
        document.getElementById("hidden-username").value = email;
        document.getElementById("hidden-password").value = pass;
        document.getElementById("spring-login-form").submit();
    }

    // ── Register ──
    function handleRegister() {
      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const phone = document.getElementById("reg-phone").value.trim();
      const pass = document.getElementById("reg-pass").value;
      let ok = true;

      if (!name || name.length < 2) { showErr("reg-name", "Tên tối thiểu 2 ký tự"); ok = false; }
      if (!email) { showErr("reg-email", "Vui lòng nhập email"); ok = false; }
      else if (!isEmail(email)) { showErr("reg-email", "Email không hợp lệ"); ok = false; }
      else if (users.find(u => u.email === email)) { showErr("reg-email", "Email đã được đăng ký"); ok = false; }
      if (!phone) { showErr("reg-phone", "Vui lòng nhập số điện thoại"); ok = false; }
      else if (!isPhone(phone)) { showErr("reg-phone", "SĐT phải 9–11 chữ số"); ok = false; }
      if (!pass || pass.length < 8) { showErr("reg-pass", "Mật khẩu tối thiểu 8 ký tự"); ok = false; }
      if (!ok) return;

      const newUser = { id: users.length + 1, name, email, phone, password: pass, role: "user" };
      users.push(newUser);
      localStorage.setItem("pt_users", JSON.stringify(users));
      localStorage.setItem("pt_user", JSON.stringify({ id: newUser.id, name, email, role: "user" }));

      showToast(`Chào mừng đến PageTurn, ${name}! 🎉`, "success");
      setTimeout(() => window.location.href = "index.html", 1200);
    }

    // ── Toast ──
    function showToast(msg, type = "") {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "show " + type;
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.className = "", 2800);
    }
  </script>
  <!-- Thêm trước </body> -->
  <form method="POST" action="/login" id="spring-login-form" style="display:none">
      <input type="hidden" name="username" id="hidden-username">
      <input type="hidden" name="password" id="hidden-password">
  </form>
</body>

</html>
