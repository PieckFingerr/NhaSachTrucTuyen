<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details — PageTurn</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/style.css">
</head>

<body>
  <div id="toast-container"></div>
  <div id="quickview-modal" class="modal-overlay hidden">
    <div class="modal-box quickview-box"><button class="modal-close" onclick="closeQuickView()">×</button>
      <div id="quickview-content"></div>
    </div>
  </div>
  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal-box auth-box"><button class="modal-close" onclick="closeAuth()">×</button>
      <div id="auth-content">
        <div class="auth-tabs"><button class="auth-tab active" onclick="switchTab('login')">Sign In</button><button
            class="auth-tab" onclick="switchTab('register')">Register</button></div>
        <div id="login-form" class="auth-form">
          <h2 class="auth-title">Welcome back</h2>
          <div class="form-group"><label>Email</label><input type="email" id="login-email"
              oninput="clearErr('login-email')"><span class="field-err" id="login-email-err"></span></div>
          <div class="form-group"><label>Password</label><input type="password" id="login-pass"
              oninput="clearErr('login-pass')"><span class="field-err" id="login-pass-err"></span></div>
          <div class="form-row"><label class="checkbox-label"><input type="checkbox" id="remember"> Remember me</label>
          </div><button class="btn-primary btn-full" onclick="handleLogin()">Sign In</button>
        </div>
        <div id="register-form" class="auth-form hidden">
          <h2 class="auth-title">Create account</h2>
          <div class="form-group"><label>Full Name</label><input type="text" id="reg-name" oninput("reg-name')"><span
              class("field-err" id("reg-name-err"></span></div>
          <div class("form-group"><label>Email</label><input type("email" id("reg-email" oninput("reg-email')"><span
              class("field-err" id("reg-email-err"></span></div>
          <div class("form-group"><label>Phone</label><input type("tel" id("reg-phone" oninput("reg-phone')"><span
              class("field-err" id("reg-phone-err"></span></div>
          <div class("form-group"><label>Password</label><input type("password" id("reg-pass" oninput("reg-pass')"><span
              class("field-err" id("reg-pass-err"></span></div><button class("btn-primary btn-full"
            onclick("handleRegister()">Create Account</button>
        </div>
      </div>
    </div>
  </div>
  <div id="cart-sidebar" class="cart-overlay hidden">
    <div class="cart-panel">
      <div class="cart-header">
        <h3>Cart (<span id="cart-count">0</span>)</h3><button onclick="toggleCart()">×</button>
      </div>
      <div id="cart-items" class="cart-items"></div>
      <div class="cart-footer">
        <div class="cart-coupon"><input type="text" id="coupon-input" placeholder="Coupon code"><button
            onclick="applyCoupon()">Apply</button></div>
        <div class="cart-totals">
          <div class="total-row"><span>Subtotal</span><span id="cart-subtotal">₫0</span></div>
          <div class="total-row discount hidden" id="discount-row"><span>Discount</span><span
              id="cart-discount">-₫0</span></div>
          <div class="total-row total"><span>Total</span><span id="cart-total">₫0</span></div>
        </div><button class="btn-primary btn-full" onclick="goToCheckout()">Checkout</button>
      </div>
    </div>
  </div>

  <header class="site-header">
    <div class="header-top">
      <div class="container"><span class="header-promo">📦 Free shipping on orders over ₫500,000</span>
        <div class="header-links"><span id="nav-auth-links"><a href="#" onclick="openAuth('login')">Sign In</a><a
              href="#" onclick="openAuth('register')" class="link-highlight">Register</a></span><span
            id="nav-user-links" class="hidden"><span class="nav-username" id="nav-username"></span><a href="#"
              onclick="handleLogout()">Sign Out</a></span></div>
      </div>
    </div>
    <nav class="navbar">
      <div class="container nav-inner">
        <a href="../index.html" class="logo"><span class="logo-icon">📖</span><span
            class="logo-text">PageTurn</span></a>
        <div class="search-bar"><input type="text" id="search-input" placeholder="Search…"
            onkeydown="if(event.key==='Enter')doSearch()"><button class="search-btn" onclick="doSearch()"><svg
              width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg></button></div>
        <div class="nav-actions"><button class="icon-btn cart-btn" onclick="toggleCart()"><svg width="20" height="20"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg><span class="cart-badge" id="cart-badge">0</span></button></div>
      </div>
    </nav>
  </header>

  <div id="product-page" class="container product-detail"></div>

  <section class="section section-alt" style="margin-top:0">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">You May Also Like</h2>
      </div>
      <div class="product-grid" id="related-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-bottom">
      <div class="container"><span>© 2025 PageTurn Bookstore</span></div>
    </div>
  </footer>

  <script src="../js/data.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const bookId = parseInt(params.get("id"));
    const book = getBookById(bookId);

    if (!book) {
      document.getElementById("product-page").innerHTML = `<div style="text-align:center;padding:80px"><h2>Book not found</h2><a href="catalog.html" class="btn-primary" style="margin-top:24px;display:inline-block">Back to Catalog</a></div>`;
    } else {
      document.title = `${book.title} — PageTurn`;
      const isLowStock = book.stock > 0 && book.stock < 5;
      const discount = book.originalPrice ? Math.round((1 - book.price / book.originalPrice) * 100) : 0;
      const saveAmt = book.originalPrice ? book.originalPrice - book.price : 0;

      document.getElementById("product-page").innerHTML = `
    <div class="breadcrumb" style="padding:20px 0 0"><a href="../index.html">Home</a> › <a href="catalog.html">Books</a> › <a href="catalog.html?cat=${book.category.toLowerCase()}">${book.category}</a> › ${book.title}</div>
    <div class="detail-grid">
      <div class="detail-images">
        <div class="main-img">${book.emoji}</div>
        ${book.isNew ? `<div class="product-badge new" style="display:inline-block;margin-bottom:12px">NEW ARRIVAL</div>` : ""}
        ${discount > 0 ? `<div class="product-badge" style="display:inline-block;margin-left:8px">-${discount}% OFF</div>` : ""}
      </div>
      <div class="detail-info">
        <div class="product-cat">${book.category}</div>
        <h1>${book.title}</h1>
        <div class="detail-author">by <strong>${book.author}</strong></div>
        <div class="detail-rating">
          <span class="stars">${"★".repeat(Math.floor(book.rating))}${"☆".repeat(5 - Math.floor(book.rating))}</span>
          <span>${book.rating} (${book.reviews} reviews)</span>
        </div>
        <div class="detail-price">
          <span class="price-main">${formatPrice(book.price)}</span>
          ${book.originalPrice ? `<span class="price-orig">${formatPrice(book.originalPrice)}</span><span class="price-save">Save ${formatPrice(saveAmt)}</span>` : ""}
        </div>
        <p class="detail-desc">${book.description}</p>
        <div class="detail-meta">
          <div class="meta-row"><strong>Category</strong><span>${book.category}</span></div>
          <div class="meta-row"><strong>Author</strong><span>${book.author}</span></div>
          <div class="meta-row"><strong>Stock</strong><span style="color:${isLowStock ? 'var(--danger)' : book.stock === 0 ? 'var(--danger)' : 'var(--success)'}">${book.stock === 0 ? "Out of Stock" : isLowStock ? `Only ${book.stock} left!` : `${book.stock} available`}</span></div>
          <div class="meta-row"><strong>Rating</strong><span>${book.rating}/5.0 (${book.reviews} reviews)</span></div>
        </div>
        <div class="detail-qty">
          <label>Quantity:</label>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <input type="text" class="qty-input" id="qty-input" value="1" readonly>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
        </div>
        <div class="detail-actions">
          <button class="btn-primary btn-lg" onclick="addDetailToCart()" ${book.stock === 0 ? "disabled" : ""}>
            ${book.stock === 0 ? "Out of Stock" : "Add to Cart"}
          </button>
          <button class="btn-outline btn-lg" onclick="buyNow()">Buy Now</button>
        </div>
        <div style="font-size:13px;color:var(--text-muted);display:flex;gap:16px;flex-wrap:wrap">
          <span>🚚 Free shipping over ₫500k</span>
          <span>↩️ 30-day returns</span>
          <span>✓ Authentic books</span>
        </div>
      </div>
    </div>

    <!-- REVIEWS -->
    <div style="margin-top:60px">
      <h2 style="font-size:24px;margin-bottom:24px">Customer Reviews</h2>
      <div class="review-grid">
        <div class="review-card"><div class="stars">★★★★★</div><p>"Absolutely amazing book! The story captivated me from the first page to the last. Highly recommend to everyone."</p><div class="reviewer"><div class="avatar">AN</div><span>Anh Nguyễn · Verified Purchase</span></div></div>
        <div class="review-card"><div class="stars">★★★★★</div><p>"One of the best books I've read this year. The writing is beautiful and the themes are deeply meaningful."</p><div class="reviewer"><div class="avatar">TH</div><span>Thành Hùng · Verified Purchase</span></div></div>
        <div class="review-card"><div class="stars">★★★★☆</div><p>"Great read! Shipping was quick and the book was in perfect condition. Will definitely order again from PageTurn."</p><div class="reviewer"><div class="avatar">LM</div><span>Lan Mai · Verified Purchase</span></div></div>
      </div>
    </div>
  `;

      // Related books
      const related = BOOKS.filter(b => b.category === book.category && b.id !== book.id).slice(0, 4);
      document.getElementById("related-grid").innerHTML = related.map(createProductCard).join("");
    }

    function changeQty(delta) {
      const input = document.getElementById("qty-input");
      if (!input || !book) return;
      const newVal = Math.max(1, Math.min(book.stock, parseInt(input.value) + delta));
      input.value = newVal;
    }
    function addDetailToCart() {
      const qty = parseInt(document.getElementById("qty-input")?.value || 1);
      addToCart(bookId, qty);
    }
    function buyNow() {
      addDetailToCart();
      goToCheckout();
    }
  </script>
</body>

</html>
