<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <th:block th:replace="~{fragments/admin-layout :: head('Orders — Admin | PageTurn')}" />
</head>

<body>
  <th:block th:replace="~{fragments/admin-layout :: sidebar('orders')}" />

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Order Management</h1>
      <div style="font-size:14px;color:var(--text-muted)">Manage and update order statuses</div>
    </div>
    <div class="admin-content">
      <!-- Summary stats row -->
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:24px" id="order-stats"></div>

      <!-- Filters -->
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
        <input type="text" id="order-search" placeholder="Search by ID or customer…"
          style="padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:14px;outline:none;width:260px"
          oninput="renderOrders()">
        <select id="order-status-filter" onchange="renderOrders()"
          style="padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:14px;outline:none">
          <option value="">All Statuses</option>
          <option>Pending</option>
          <option>Confirmed</option>
          <option>Shipping</option>
          <option>Delivered</option>
          <option>Cancelled</option>
        </select>
        <select id="order-pay-filter" onchange="renderOrders()"
          style="padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius-md);font-size:14px;outline:none">
          <option value="">All Payments</option>
          <option value="cod">COD</option>
          <option value="card">Card</option>
          <option value="ewallet">E-Wallet</option>
        </select>
        <span style="font-size:13px;color:var(--text-muted)" id="order-count"></span>
      </div>

      <div class="admin-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Items</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Update Status</th>
              <th>Invoice</th>
            </tr>
          </thead>
          <tbody id="orders-table"></tbody>
        </table>
      </div>
    </div>
  </main>
  </div>
  </div>

  <th:block th:replace="~{fragments/admin-layout :: scripts}" />

  <script>
    const DEMO_ORDERS = [
      { id: "ORD-1748001", shippingInfo: { name: "Minh Nguyen", phone: "0901234567", email: "minh@mail.com", city: "Hồ Chí Minh" }, date: "01/05/2025", items: [{ id: 1, qty: 1 }, { id: 2, qty: 2 }], subtotal: 607000, discount: 0, shipping: 0, total: 607000, paymentMethod: "cod", status: "Delivered" },
      { id: "ORD-1748002", shippingInfo: { name: "Thu Lan", phone: "0912345678", email: "lan@mail.com", city: "Hà Nội" }, date: "02/05/2025", items: [{ id: 4, qty: 1 }], subtotal: 259000, discount: 0, shipping: 30000, total: 289000, paymentMethod: "card", status: "Shipping" },
      { id: "ORD-1748003", shippingInfo: { name: "Hung Tran", phone: "0923456789", email: "hung@mail.com", city: "Đà Nẵng" }, date: "03/05/2025", items: [{ id: 3, qty: 1 }, { id: 5, qty: 2 }], subtotal: 617000, discount: 50000, shipping: 0, total: 567000, paymentMethod: "ewallet", status: "Confirmed" },
      { id: "ORD-1748004", shippingInfo: { name: "Lan Mai", phone: "0934567890", email: "lanmai@mail.com", city: "Hồ Chí Minh" }, date: "04/05/2025", items: [{ id: 6, qty: 1 }], subtotal: 219000, discount: 0, shipping: 30000, total: 249000, paymentMethod: "cod", status: "Pending" },
      { id: "ORD-1748005", shippingInfo: { name: "Anh Pham", phone: "0945678901", email: "anh@mail.com", city: "Cần Thơ" }, date: "05/05/2025", items: [{ id: 7, qty: 2 }], subtotal: 358000, discount: 0, shipping: 30000, total: 388000, paymentMethod: "card", status: "Pending" },
      { id: "ORD-1748006", shippingInfo: { name: "Nam Vo", phone: "0956789012", email: "nam@mail.com", city: "Hải Phòng" }, date: "05/05/2025", items: [{ id: 8, qty: 1 }], subtotal: 279000, discount: 0, shipping: 30000, total: 309000, paymentMethod: "ewallet", status: "Cancelled" },
    ];

    function getAllOrders() {
      const saved = JSON.parse(localStorage.getItem("pt_orders") || "[]");
      // Merge with demo, avoiding duplicates
      const ids = new Set(saved.map(o => o.id));
      return [...saved, ...DEMO_ORDERS.filter(o => !ids.has(o.id))];
    }

    function renderStats(orders) {
      const statuses = ["Pending", "Confirmed", "Shipping", "Delivered", "Cancelled"];
      const colors = ["#FAC775", "#85B7EB", "#9FE1CB", "#5DCAA5", "#F09595"];
      const el = document.getElementById("order-stats");
      el.innerHTML = statuses.map((s, i) => {
        const count = orders.filter(o => o.status === s).length;
        return `<div style="background:${colors[i]}22;border:1px solid ${colors[i]};border-radius:var(--radius-md);padding:16px;text-align:center">
      <div style="font-size:22px;font-weight:700;color:var(--ink)">${count}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:2px">${s}</div>
    </div>`;
      }).join("");
    }

    function renderOrders() {
      const search = document.getElementById("order-search").value.toLowerCase();
      const statusF = document.getElementById("order-status-filter").value;
      const payF = document.getElementById("order-pay-filter").value;
      let orders = getAllOrders();

      renderStats(orders);

      if (search) orders = orders.filter(o => o.id.toLowerCase().includes(search) || (o.shippingInfo?.name || "").toLowerCase().includes(search));
      if (statusF) orders = orders.filter(o => o.status === statusF);
      if (payF) orders = orders.filter(o => (o.paymentMethod || "").toLowerCase() === payF);

      document.getElementById("order-count").textContent = `${orders.length} orders`;

      const statusMap = { Pending: "badge-warning", Confirmed: "badge-info", Shipping: "badge-info", Delivered: "badge-success", Cancelled: "badge-danger" };
      const tbody = document.getElementById("orders-table");
      tbody.innerHTML = orders.map(o => {
        const itemCount = o.items.reduce((s, i) => s + (i.qty || 1), 0);
        const itemNames = o.items.slice(0, 2).map(i => {
          const b = getBookById(i.id) || i.book;
          return b ? b.title : "—";
        }).join(", ") + (o.items.length > 2 ? `… (+${o.items.length - 2})` : "");
        return `<tr>
      <td style="font-family:monospace;font-size:12px;font-weight:600">${o.id}</td>
      <td>
        <div style="font-weight:500">${o.shippingInfo?.name || "—"}</div>
        <div style="font-size:12px;color:var(--text-muted)">${o.shippingInfo?.city || ""}</div>
      </td>
      <td style="font-size:13px">${o.date}</td>
      <td>
        <div style="font-size:13px">${itemCount} item${itemCount !== 1 ? "s" : ""}</div>
        <div style="font-size:11px;color:var(--text-muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${itemNames}</div>
      </td>
      <td><strong>${formatPrice(o.total || 0)}</strong></td>
      <td><span style="font-size:12px;text-transform:uppercase;font-weight:600;color:var(--text-muted)">${o.paymentMethod || "COD"}</span></td>
      <td><span class="badge ${statusMap[o.status] || "badge-warning"}">${o.status}</span></td>
      <td>
        <select style="border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:12px;cursor:pointer" onchange="updateStatus('${o.id}', this.value)">
          <option ${o.status === "Pending" ? "selected" : ""}>Pending</option>
          <option ${o.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
          <option ${o.status === "Shipping" ? "selected" : ""}>Shipping</option>
          <option ${o.status === "Delivered" ? "selected" : ""}>Delivered</option>
          <option ${o.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
        </select>
      </td>
      <td><button class="btn-ghost btn-sm" onclick="printInvoice('${o.id}')">🖨️ Print</button></td>
    </tr>`;
      }).join("") || `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted)">No orders found</td></tr>`;
    }

    const VALID_TRANSITIONS = {
      "Pending": ["Confirmed", "Cancelled"],
      "Confirmed": ["Shipping"],
      "Shipping": ["Delivered"],
      "Delivered": [],
      "Cancelled": [],
    };

    function updateStatus(orderId, newStatus) {
      const orders = JSON.parse(localStorage.getItem("pt_orders") || "[]");
      const order = getAllOrders().find(o => o.id === orderId);
      if (!order) return;

      const allowed = VALID_TRANSITIONS[order.status] || [];
      if (!allowed.includes(newStatus)) {
        showToast(`Không thể chuyển từ "${order.status}" → "${newStatus}"`, "error");
        renderOrders(); // reset select về giá trị cũ
        return;
      }

      const savedOrder = orders.find(o => o.id === orderId);
      if (savedOrder) {
        savedOrder.status = newStatus;
        localStorage.setItem("pt_orders", JSON.stringify(orders));
      }
      showToast(`Order ${orderId} → ${newStatus}`, "success");
      setTimeout(() => renderOrders(), 300);
    }

    function printInvoice(orderId) {
      showToast("Invoice printing: connect to Spring Boot PDF endpoint", "info");
    }

    document.addEventListener("booksLoaded", () => {
      if (checkAdminAccess()) renderOrders();
    });
  </script>
</body>

</html>
