<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <th:block th:replace="~{fragments/admin-layout :: head('Coupons — Admin | PageTurn')}" />
</head>

<body>
  <div id="toast-container"></div>
  <div id="access-denied" class="hidden"
    style="position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px">
    <div style="font-size:64px">🔒</div>
    <h2>Access Denied</h2><a href="/" class="btn-primary">Back to Home</a>
  </div>
  <!-- Coupon Modal -->
  <div id="coupon-modal" class="modal-overlay hidden">
    <div class="modal-box" style="width:480px;padding:36px">
      <button class="modal-close" onclick="closeCouponModal()">×</button>
      <h2 class="auth-title" id="coupon-modal-title">Create Coupon</h2>
      <div class="form-group"><label>Coupon Code *</label><input type="text" id="c-code" placeholder="e.g. SUMMER20"
          style="text-transform:uppercase" oninput="clearErr('c-code')"><span class="field-err" id="c-code-err"></span>
      </div>
      <div class="form-group"><label>Discount Type *</label>
        <select id="c-type" onchange="toggleTypeFields()">
          <option value="percent">Percentage (%)</option>
          <option value="fixed">Fixed Amount (₫)</option>
        </select>
      </div>
      <div class="form-group"><label id="c-value-label">Discount Value (%) *</label><input type="number" id="c-value"
          min="1" oninput="clearErr('c-value')"><span class="field-err" id="c-value-err"></span></div>
      <div class="form-group"><label>Minimum Order (₫)</label><input type="number" id="c-min" min="0"
          placeholder="0 = no minimum"></div>
      <div class="form-group"><label>Description</label><input type="text" id="c-desc"
          placeholder="e.g. Summer sale discount"></div>
      <div class="form-group"><label class="checkbox-label"><input type="checkbox" id="c-active" checked> Active</label>
      </div>
      <div style="display:flex;gap:12px;margin-top:20px">
        <button class="btn-primary btn-full" onclick="saveCoupon()">Save Coupon</button>
        <button class="btn-ghost" onclick="closeCouponModal()">Cancel</button>
      </div>
    </div>
  </div>
  <th:block th:replace="~{fragments/admin-layout :: sidebar('coupons')}" />
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Coupon Management</h1>
      <button class="btn-primary" onclick="openCouponModal()">+ Create Coupon</button>
    </div>
    <div class="admin-content">
      <!-- Active coupons cards -->
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-bottom:32px"
        id="coupon-cards"></div>

      <div class="admin-table-wrap">
        <div class="admin-table-head">
          <h3>All Coupons</h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Type</th>
              <th>Value</th>
              <th>Min. Order</th>
              <th>Description</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="coupons-table"></tbody>
        </table>
      </div>
    </div>
  </main>
  </div>
  </div>

  <th:block th:replace="~{fragments/admin-layout :: scripts}" />

  <script>

    let coupons = JSON.parse(localStorage.getItem("pt_coupons") || JSON.stringify([
      { id: 1, code: "BOOK40", type: "percent", value: 40, minOrder: 0, description: "40% off all books", active: true },
      { id: 2, code: "SUMMER20", type: "percent", value: 20, minOrder: 300000, description: "20% off orders over ₫300k", active: true },
      { id: 3, code: "WELCOME50", type: "fixed", value: 50000, minOrder: 200000, description: "₫50k off orders over ₫200k", active: true },
      { id: 4, code: "WINTER15", type: "percent", value: 15, minOrder: 0, description: "Winter promotion", active: false },
    ]));
    let editingCouponId = null;

    function renderCoupons() {
      // Cards for active
      const active = coupons.filter(c => c.active);
      document.getElementById("coupon-cards").innerHTML = active.map(c => `
    <div style="background:linear-gradient(135deg,var(--ink),#3D2410);border-radius:var(--radius-lg);padding:24px;color:#fff;position:relative;overflow:hidden">
      <div style="position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.05)"></div>
      <div style="font-size:11px;opacity:0.6;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px">${c.type === "percent" ? "Percentage Discount" : "Fixed Discount"}</div>
      <div style="font-family:var(--font-serif);font-size:36px;font-weight:700;color:#E8A87C;margin-bottom:8px">${c.type === "percent" ? c.value + "%" : formatPrice(c.value)}</div>
      <div style="font-family:monospace;font-size:18px;font-weight:700;letter-spacing:3px;margin-bottom:8px">${c.code}</div>
      <div style="font-size:13px;opacity:0.6">${c.minOrder > 0 ? "Min. order: " + formatPrice(c.minOrder) : "No minimum order"}</div>
      <div style="font-size:12px;opacity:0.5;margin-top:4px">${c.description}</div>
    </div>
  `).join("") || `<p style="color:var(--text-muted);font-size:14px">No active coupons</p>`;

      document.getElementById("coupons-table").innerHTML = coupons.map(c => `<tr>
    <td><strong style="font-family:monospace;letter-spacing:1px">${c.code}</strong></td>
    <td>${c.type === "percent" ? "Percentage" : "Fixed Amount"}</td>
    <td><strong style="color:var(--accent)">${c.type === "percent" ? c.value + "%" : formatPrice(c.value)}</strong></td>
    <td>${c.minOrder > 0 ? formatPrice(c.minOrder) : "None"}</td>
    <td style="font-size:13px;color:var(--text-muted)">${c.description}</td>
    <td><span class="badge ${c.active ? "badge-success" : "badge-danger"}">${c.active ? "Active" : "Inactive"}</span></td>
    <td>
      <div style="display:flex;gap:6px">
        <button class="btn-ghost btn-sm" onclick="toggleCoupon(${c.id})">${c.active ? "Deactivate" : "Activate"}</button>
        <button class="btn-primary btn-sm" onclick="editCoupon(${c.id})">Edit</button>
        <button class="btn-ghost btn-sm" onclick="deleteCoupon(${c.id})" style="color:var(--danger)">Delete</button>
      </div>
    </td>
  </tr>`).join("");
    }

    function openCouponModal(id = null) {
      editingCouponId = id;
      if (id) {
        const c = coupons.find(x => x.id === id);
        document.getElementById("coupon-modal-title").textContent = "Edit Coupon";
        document.getElementById("c-code").value = c.code;
        document.getElementById("c-type").value = c.type;
        document.getElementById("c-value").value = c.value;
        document.getElementById("c-min").value = c.minOrder;
        document.getElementById("c-desc").value = c.description;
        document.getElementById("c-active").checked = c.active;
        toggleTypeFields();
      } else {
        document.getElementById("coupon-modal-title").textContent = "Create Coupon";
        ["c-code", "c-value", "c-min", "c-desc"].forEach(id => document.getElementById(id).value = "");
        document.getElementById("c-type").value = "percent";
        document.getElementById("c-active").checked = true;
        toggleTypeFields();
      }
      document.getElementById("coupon-modal").classList.remove("hidden");
    }
    function editCoupon(id) { openCouponModal(id); }
    function closeCouponModal() { document.getElementById("coupon-modal").classList.add("hidden"); }
    function toggleTypeFields() {
      const type = document.getElementById("c-type").value;
      document.getElementById("c-value-label").textContent = type === "percent" ? "Discount Value (%) *" : "Discount Amount (₫) *";
    }

    function saveCoupon() {
      const code = document.getElementById("c-code").value.trim().toUpperCase();
      const value = parseInt(document.getElementById("c-value").value);
      let valid = true;
      if (!code) { showFieldErr("c-code", "Code is required"); valid = false; }
      if (!value || value <= 0) { showFieldErr("c-value", "Value must be greater than 0"); valid = false; }
      if (!valid) return;

      const coupon = {
        id: editingCouponId || (Math.max(0, ...coupons.map(c => c.id)) + 1),
        code,
        type: document.getElementById("c-type").value,
        value,
        minOrder: parseInt(document.getElementById("c-min").value) || 0,
        description: document.getElementById("c-desc").value,
        active: document.getElementById("c-active").checked,
      };

      if (editingCouponId) { const i = coupons.findIndex(c => c.id === editingCouponId); coupons[i] = coupon; showToast("Coupon updated!", "success"); }
      else { coupons.push(coupon); showToast("Coupon created!", "success"); }
      localStorage.setItem("pt_coupons", JSON.stringify(coupons));
      closeCouponModal();
      renderCoupons();
    }
    function toggleCoupon(id) {
      const c = coupons.find(x => x.id === id);
      if (c) { c.active = !c.active; localStorage.setItem("pt_coupons", JSON.stringify(coupons)); showToast(`Coupon ${c.active ? "activated" : "deactivated"}`, c.active ? "success" : "info"); renderCoupons(); }
    }
    function deleteCoupon(id) {
      const c = coupons.find(x => x.id === id);
      if (!confirm(`Delete coupon "${c?.code}"?`)) return;
      coupons = coupons.filter(x => x.id !== id);
      localStorage.setItem("pt_coupons", JSON.stringify(coupons));
      showToast("Coupon deleted", "info");
      renderCoupons();
    }
    document.addEventListener("DOMContentLoaded", () => { if (checkAdminAccess()) renderCoupons(); });
    document.getElementById("coupon-modal")?.addEventListener("click", function (e) { if (e.target === this) closeCouponModal(); });
  </script>
</body>

</html>
